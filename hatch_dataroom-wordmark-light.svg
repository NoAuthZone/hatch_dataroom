<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 256" role="img" aria-labelledby="t">
  <title id="t">hatch_dataroom</title>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2fc99a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38d9a9" stop-opacity=".38"/>
      <stop offset="1" stop-color="#38d9a9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g>
  <!-- tile -->
  <rect x="4" y="4" width="248" height="248" rx="56" fill="#0b0e14" stroke="#252d3d" stroke-width="2"/>
  <!-- the opening of the hatch with a soft glow of data coming out -->
  <rect x="52" y="92" width="152" height="116" rx="18" fill="#080b10"/>
  <rect x="52" y="92" width="152" height="116" rx="18" fill="url(#glow)"/>
  <!-- files stored inside: three rows -->
  <g fill="url(#a)">
    <rect x="72" y="115" width="10" height="10" rx="3"/><rect x="92" y="115" width="92" height="10" rx="5"/>
    <rect x="72" y="141" width="10" height="10" rx="3"/><rect x="92" y="141" width="64" height="10" rx="5" opacity=".85"/>
    <rect x="72" y="167" width="10" height="10" rx="3"/><rect x="92" y="167" width="78" height="10" rx="5" opacity=".7"/>
  </g>
  <!-- frame of the opening -->
  <rect x="52" y="92" width="152" height="116" rx="18" fill="none" stroke="url(#a)" stroke-width="9"/>
  <!-- the lid, swung open upwards -->
  <path d="M56 90 L78 46 H178 L200 90 Z" fill="#131822" stroke="url(#a)" stroke-width="9" stroke-linejoin="round"/>
  <circle cx="128" cy="68" r="8" fill="url(#a)"/>
</g>
  <text x="290" y="152" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="84" font-weight="700" letter-spacing="-1" fill="#0b0e14">hatch<tspan fill="#38d9a9">_</tspan>dataroom</text>
  <text x="292" y="196" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="500" letter-spacing="1.5" fill="#8a94a7">ENCRYPTED FILE EXCHANGE</text>
</svg>
